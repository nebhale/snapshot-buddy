name: buddy-metrics

services:
  samplicator:
    image: heywoodlh/samplicator@sha256:f0df9380ded89c79a179799a27b42a462fd129c3dc80e95bd5e4dd1dd529bebf
    user: "10001:10001"
    restart: unless-stopped
    # Linux Docker host: localhost below refers to the host's published ports.
    network_mode: host
    command: ["-4", "-s", "${METRICS_HOST:?Set METRICS_HOST to the Docker host LAN IP}", "-p", "8514", "-c", "/config/samplicator.conf"]
    volumes:
      - ./samplicator.conf:/config/samplicator.conf:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
